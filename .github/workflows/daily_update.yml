name: Daily US Stock Market DCF Auto-Refresh

on:
  schedule:
    # 於美股收盤後定期執行 (UTC 21:30，對應週一至週五)
    - cron: '30 21 * * 1-5'
  workflow_dispatch:
    inputs:
      peers_only:
        description: Refresh provider peer lists only, preserving financial values
        type: boolean
        default: false
      prices_only:
        description: Refresh real Profile price and volume charts only
        type: boolean
        default: false
      liquidation_only:
        description: Refresh latest-quarter liquidation inputs only, preserving DCF calculations
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh-market:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Node for shared financial return calculations
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pydantic google-genai

      - name: Ensure Cache Folders Exist
        run: |
          mkdir -p cache/moat cache/descriptions cache/financials cache/company_meta cache/peers

      - name: Refresh official historical USD exchange rates
        if: inputs.peers_only != true && inputs.prices_only != true
        run: node scripts/refresh_usd_rates.cjs

      - name: Run Market Engine with FMP Key
        if: inputs.peers_only != true && inputs.prices_only != true && inputs.liquidation_only != true
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          python -u build_full_market.py

      - name: Refresh provider peer lists only
        if: inputs.peers_only == true
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        run: python -u scripts/refresh_peers.py

      - name: Capture current FCFF source evidence
        id: fcff-refresh
        if: inputs.peers_only != true && inputs.prices_only != true && inputs.liquidation_only != true
        continue-on-error: true
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          CAPTURE_FCFF_SOURCES_ONLY: 'true'
        run: python -u scripts/capture_valuation_sources.py

      - name: Compile shared FCFF inputs and source limitations
        if: steps.fcff-refresh.outcome == 'success'
        run: node scripts/build_fcff.cjs

      - name: Report retained FCFF source dates
        if: steps.fcff-refresh.outcome == 'failure'
        run: echo "::warning::FCFF source refresh failed. Existing dated FCFF inputs are retained, not relabeled as current. Missing or unreconciled inputs remain explicitly unavailable."

      - name: Refresh real Profile daily prices and volume
        id: price-refresh
        if: inputs.peers_only != true && inputs.liquidation_only != true
        continue-on-error: ${{ inputs.prices_only != true }}
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        run: python -u scripts/refresh_price_charts.py

      - name: Report retained price history
        if: steps.price-refresh.outcome == 'failure' && inputs.prices_only != true
        run: echo "::warning::Profile prices could not be refreshed. Existing dated price caches are retained; independent financial updates continue."

      - name: Refresh latest-quarter liquidation sources
        id: liquidation-refresh
        if: inputs.peers_only != true && inputs.prices_only != true
        continue-on-error: ${{ inputs.liquidation_only != true }}
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        run: python -u scripts/refresh_liquidation.py

      - name: Report retained liquidation snapshot
        if: steps.liquidation-refresh.outcome == 'failure' && inputs.liquidation_only != true
        run: echo "::warning::Liquidation source refresh failed. The existing explicitly dated snapshot is retained; independent financial updates continue."

      - name: Apply shared liquidation calculations
        if: inputs.peers_only != true && inputs.prices_only != true
        run: node scripts/apply_liquidation.cjs

      - name: Validate provider parsing and comparison coverage
        run: |
          python -m unittest discover -s tests -p test_peer_cache.py
          python -m unittest discover -s tests -p test_price_charts.py
          python -m unittest discover -s tests -p test_liquidation.py
          node --test tests/peer_comparison.test.cjs tests/reported_growth.test.cjs tests/price_history.test.cjs tests/liquidation.test.cjs
          node --test tests/fcff.test.cjs tests/fcff_drivers.test.cjs tests/fcff_sources.test.cjs tests/fcff_integration.test.cjs

      - name: Commit & Push New DCF Dataset & Persistent Cache
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # 拉取遠端最新代碼以防止衝突
          git pull origin main --rebase --autostash || true
          
          # 暫存資料集與強制追蹤快取資料夾
          git add full_market_dcf.json market_data.js 2>/dev/null || true
          git add fcff_data.js
          git add -f cache/
          
          # 檢查是否有更動，有更動才提交以節省 Actions 次數
          if ! git diff --cached --quiet; then
            git commit -m "Auto refresh US stock DCF data & persist AI Cache [skip ci]"
            git push origin main
          else
            echo "No data changes detected. Skipping push."
          fi
