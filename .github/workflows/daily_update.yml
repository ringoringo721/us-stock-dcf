name: Daily US Stock Market DCF Auto-Refresh

on:
  schedule:
    - cron: '30 21 * * 1-5'
  workflow_dispatch:

# 強制給予寫入與檢出權限
permissions:
  contents: write
  pull-requests: write

jobs:
  refresh-market:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install requests pydantic google-genai

      - name: Cache AI Moat, Financials and Description Files
        uses: actions/cache@v4
        with:
          path: |
            cache/moat
            cache/descriptions
            cache/financials
          key: market-data-cache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            market-data-cache-${{ runner.os }}-

      - name: Run Market Engine with FMP Key
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          python -u build_full_market.py

      - name: Commit & Push New DCF Dataset & Cache
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git pull origin main --rebase --autostash
          git add full_market_dcf.json market_data.js cache/
          git diff-index --quiet HEAD || git commit -m "Auto refresh US stock DCF data & Cache [skip ci]"
          git push origin main
