name: Daily US Stock Market DCF Auto-Refresh

on:
  schedule:
    # 於美股收盤後定期執行 (UTC 21:30，對應週一至週五)
    - cron: '30 21 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh-market:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pydantic google-genai

      - name: Ensure Cache Folders Exist
        run: |
          mkdir -p cache/moat cache/descriptions cache/financials cache/company_meta cache/peers

      - name: Run Market Engine with FMP Key
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          python -u build_full_market.py

      - name: Commit & Push New DCF Dataset & Persistent Cache
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # 拉取遠端最新代碼以防止衝突
          git pull origin main --rebase --autostash || true
          
          # 暫存資料集與強制追蹤快取資料夾
          git add full_market_dcf.json market_data.js 2>/dev/null || true
          git add -f cache/
          
          # 檢查是否有更動，有更動才提交以節省 Actions 次數
          if ! git diff --cached --quiet; then
            git commit -m "Auto refresh US stock DCF data & persist AI Cache [skip ci]"
            git push origin main
          else
            echo "No data changes detected. Skipping push."
          fi
