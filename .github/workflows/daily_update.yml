name: Daily US Stock Market DCF Auto-Refresh

on:
  schedule:
    - cron: '30 21 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-market:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Packages
        run: pip install requests

      - name: Run Market Engine
        run: python build_full_market.py

      - name: Commit & Push New JSON
        run: |
          git config --global user.name "Market-DCF-Bot"
          git config --global user.email "bot@dcf.local"
          git add full_market_dcf.json
          git commit -m "Auto refresh full market DCF with real fundamentals" || exit 0
          git push
