name: Daily US Stock Market DCF Auto-Refresh

on:
  schedule:
    # 於美股收盤後定期執行 (UTC 21:30，對應週一至週五)
    - cron: '30 21 * * 1-5'
  workflow_dispatch:
    inputs:
      chart_only:
        description: "Only refresh sourced chart history; skip DCF and AI analysis"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: daily-market-refresh
  cancel-in-progress: false

jobs:
  refresh-market:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pydantic google-genai

      - name: Run Fixture Tests
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v
          node --test tests/test_historical_chart.js

      - name: Ensure Cache Folders Exist
        run: |
          mkdir -p cache/moat cache/descriptions cache/financials cache/company_meta cache/peers cache/historical_prices

      - name: Run Market Engine with FMP Key
        if: ${{ inputs.chart_only != true }}
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          python -u build_full_market.py

      - name: Refresh Historical Charts Only
        if: ${{ inputs.chart_only == true }}
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        run: |
          python -u refresh_historical_charts.py

      - name: Validate Generated Dataset
        run: |
          python validate_market_data.py --data full_market_dcf.json --report cache/historical_prices/coverage_report.json

      - name: Commit & Push New DCF Dataset & Persistent Cache
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git pull origin "${GITHUB_REF_NAME}" --rebase --autostash
          
          # 暫存資料集、覆蓋率報告與持久化快取
          git add full_market_dcf.json market_data.js
          git add -f cache/
          
          # 檢查是否有更動，有更動才提交以節省 Actions 次數
          if ! git diff --cached --quiet; then
            git commit -m "Auto refresh US stock DCF data & persist AI Cache [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo "No data changes detected. Skipping push."
          fi
