name: Daily US Stock Market DCF Auto-Refresh

on:
  schedule:
    - cron: '30 21 * * 1-5'
  workflow_dispatch:

# 強制給予寫入與檢出權限
permissions:
  contents: write
  pull-requests: write

jobs:
  refresh-market:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install requests

      - name: Run Market Engine with FMP Key
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        run: |
          python build_full_market.py

      - name: Commit & Push New DCF Dataset
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Auto refresh US stock DCF data with FMP [skip ci]" || echo "No changes to commit"
          git push origin main
