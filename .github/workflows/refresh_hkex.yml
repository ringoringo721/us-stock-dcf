name: Refresh HKEX constituents, gaming extension and release-driven ratings

on:
  schedule:
    - cron: '30 11 * * 1-5'
    - cron: '30 23 * * 0-4'
  workflow_dispatch:
    inputs:
      moat_limit:
        description: Optional max moat remoats this run (empty = all pending ≥ HKD 1B). Use to batch/resume under time pressure; next run continues via policy/evidence mismatch (no --force).
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: hkex-data-refresh
  cancel-in-progress: false

jobs:
  refresh-hkex:
    # Schedule stays on main. workflow_dispatch may run from a tooling PR branch so
    # timeout / FX / prompt fixes can remoat before that PR merges (data still commits to main).
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # ~104 ≥HKD1B remoats at ~150-word/dim take ~80–100+ min of Vertex alone after capture;
    # 90m was cancelling mid-moat and discarding checkpoints (no commit).
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Overlay moat refresh tooling from workflow ref
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        run: |
          # Worktree-only overlay: do NOT `git checkout FETCH_HEAD --` (that stages
          # tooling into the index and the persist commit would push it to main).
          git fetch origin "${{ github.ref }}"
          for path in \
            scripts/refresh_hkex_moat.py \
            scripts/refresh_usd_rates.cjs \
            tests/test_hkex_moat.py \
            README.md
          do
            git show "FETCH_HEAD:$path" > "$path"
          done
          git update-index --refresh >/dev/null 2>&1 || true
          if ! git diff --quiet -- \
              scripts/refresh_hkex_moat.py \
              scripts/refresh_usd_rates.cjs \
              tests/test_hkex_moat.py \
              README.md; then
            echo "Overlaid moat/FX tooling in worktree only from ${{ github.ref }} @ ${{ github.sha }}"
          else
            echo "Tooling already matches ${{ github.ref }}"
          fi
          if ! git diff --cached --quiet; then
            echo "::error::Overlay must not stage index changes"
            git diff --cached --name-only
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install requests google-genai
      - name: Refresh official dated currency observations
        run: node scripts/refresh_usd_rates.cjs --hkd
      - name: Capture genuine HKEX statements, prices, release dates and available call
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          CAPTURE_MARKET: HKEX
          CAPTURE_OUTPUT: hkex-source-output
        run: python -u scripts/capture_valuation_sources.py
      - name: Prepare HKD inputs and content-based rating evidence
        env:
          MOAT_EVIDENCE_OUTPUT: hkex-source-output/moat-inputs.json
        run: node scripts/build_hkex.cjs hkex-source-output hkex-data-output
      # Scheduled path: evidence/policy-hash refresh only. Never pass --force here
      # (--force remoats nearly all HK names; use valuation_audit force_moat + FORCE_MOAT_CONFIRM for recovery).
      # Prefer --retry-incomplete for null-score gaps (manual / recover scripts).
      # Market-cap screen already skips known caps below HKD 1B; optional moat_limit batches resume.
      - name: Reassess moat only on changed evidence
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          LIMIT_ARGS=()
          # github.event.inputs is empty on schedule; only set for workflow_dispatch.
          MOAT_LIMIT="${{ github.event.inputs.moat_limit }}"
          if [ -n "$MOAT_LIMIT" ]; then
            LIMIT_ARGS=(--limit "$MOAT_LIMIT")
          fi
          python -u scripts/refresh_hkex_moat.py \
            hkex-source-output/moat-inputs.json \
            hkex-data-output/cache/hkex_moat.json \
            "${LIMIT_ARGS[@]}"
      # Keep remoat checkpoint even on job timeout (timeout == cancelled in Actions)
      # or later Persist failure. continue-on-error so upload blips never skip Persist.
      - name: Upload moat checkpoint after remoat
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: hkex-moat-checkpoint
          path: |
            hkex-data-output/cache/hkex_moat.json
          retention-days: 14
          if-no-files-found: warn
      - name: Apply configured HKEX listings and dated score provenance
        run: |
          node scripts/build_hkex.cjs hkex-source-output . hkex-data-output/cache/hkex_moat.json
          cp hkex-data-output/cache/hkex_moat.json cache/hkex_moat.json
      - name: Validate source, currency, period and valuation consistency
        run: |
          node --test tests/hkd_currency.test.cjs tests/statement_scores.test.cjs tests/hkex_sources.test.cjs tests/usd_currency.test.cjs tests/fcff.test.cjs tests/fcff_drivers.test.cjs tests/fcff_sources.test.cjs tests/liquidation.test.cjs
          node --test tests/gaming_expansion.test.cjs tests/gaming_history_sources.test.cjs
          python -m unittest discover -s tests -p test_hkex_moat.py
      - name: Capture genuine HKEX FMP models and company disclosures
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        run: node scripts/capture_company_data.cjs "$(node -p "require('./hkex_stocks.json').map(stock => stock.ticker).join(',')")"
      - name: Persist financial-company ROTE history and reuse unchanged references
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        run: node scripts/capture_rote_history.cjs
      - name: Persist verified data without replacing US datasets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Moat/validate already ran. Drop worktree-only tooling overlay and any staged
          # non-data paths so the data commit cannot carry scripts/tests/README.
          git restore --source=HEAD --worktree --staged -- \
            scripts/refresh_hkex_moat.py \
            scripts/refresh_usd_rates.cjs \
            tests/test_hkex_moat.py \
            README.md || true
          git reset --quiet HEAD
          git add hk_market_dcf.json hk_market_data.js hk_fcff_data.js
          git add fmp_model_data.js
          git add -f cache/company/*.HK.json
          git add -f cache/rote_history/*.HK.json
          git add -f cache/hkex_moat.json cache/financials/*.HK_statements_v2.json cache/price_charts/*.HK.json cache/fx/hkd_rates.json
          if git diff --cached --name-only | grep -Eiv '^(hk_market_dcf\.json|hk_market_data\.js|hk_fcff_data\.js|fmp_model_data\.js|cache/(company|rote_history|financials|price_charts|fx|hkex_moat))'; then
            echo "::error::Persist staging includes paths outside the HKEX data allowlist:"
            git diff --cached --name-only
            exit 1
          fi
          if ! git diff --cached --quiet; then
            git commit -m "Refresh real HKEX data and evidence-based ratings [skip ci]" -m "Co-authored-by: Copilot App <223556219+Copilot@users.noreply.github.com>"
            # capture_rote_history may dirty US rote_history/* (outside HK allowlist).
            # Those leftovers + any discarded overlay dirt block `git pull --rebase`
            # (run 40051067414: commit ok locally, push never ran). Hard-reset to the
            # just-created allowlist commit so only that commit is rebased/pushed.
            git reset --hard HEAD
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Request production publication of the committed data
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK" ]; then
            echo "::warning::No production deploy hook configured. Repository data is refreshed; production publication is not confirmed."
            exit 0
          fi
          curl --fail --silent --show-error --request POST "$VERCEL_DEPLOY_HOOK" --output /tmp/hkex-deployment.json
          node -e "const r=require('/tmp/hkex-deployment.json');if(!r.job?.id)throw new Error('Deployment request not confirmed');console.log('Production deployment requested; final readiness is reported by Vercel.');"
      - name: Preserve explicit source and model failures for diagnosis
        # failure() alone misses timeout-minutes (treated as cancelled).
        if: failure() || cancelled()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: hkex-refresh-failure-evidence
          # Include moat checkpoints so a late persist failure does not discard an 80m+ remoat.
          path: |
            hkex-source-output/
            hkex-data-output/cache/hkex_moat.json
            cache/hkex_moat.json
          retention-days: 7
          if-no-files-found: warn
