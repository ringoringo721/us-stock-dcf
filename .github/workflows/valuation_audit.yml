name: HK researched moat preflight - artifacts only
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research-and-assess:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --quiet google-genai
      - name: Retrieve attributable business evidence
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -u scripts/research_hkex_moat.py valuation-audit-input/hk-moat-evidence.json researched-input.json business-research.json
      - name: Reassess using verified business and financial evidence
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -u scripts/refresh_hkex_moat.py researched-input.json researched-assessments.json --force
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: researched-moat-preflight
          path: |
            researched-input.json
            business-research.json
            researched-assessments.json
          retention-days: 7
