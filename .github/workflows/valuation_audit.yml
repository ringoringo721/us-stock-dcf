name: Read-only valuation source audit

on:
  workflow_dispatch:
    inputs:
      symbols:
        description: Optional comma-separated provider symbols (maximum 20); empty captures the existing universe
        type: string
        default: ''
      lease_sources_only:
        description: Capture original lease classification evidence only, without changing valuations
        type: boolean
        default: false
      shares_only:
        description: Capture dated outstanding-share counts only, without publishing or changing valuations
        type: boolean
        default: false
      build_hkex:
        description: Build configured HSI constituents and evidence-based ratings as review artifacts only
        type: boolean
        default: false
      force_moat:
        description: Regenerate all HKEX moat scores and bilingual comments using Vertex AI (artifacts only)
        type: boolean
        default: false
      translate_news:
        description: Translate captured news headlines only using Vertex Flash-Lite; save artifacts without publishing
        type: boolean
        default: false
      expand_all_hk:
        description: Capture all additional official HKEX companies and researched ratings; unpublished artifacts only
        type: boolean
        default: false
      resume_run_id:
        description: Optional previous all-HK run ID to reuse successfully captured endpoints
        type: string
        default: ''

permissions:
  contents: read
  actions: read

jobs:
  capture-fmp:
    if: inputs.translate_news != true && inputs.expand_all_hk != true
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install requests
      - uses: actions/setup-node@v4
        if: inputs.build_hkex == true
        with:
          node-version: '24'
      - run: pip install google-genai
        if: inputs.build_hkex == true
      - name: Refresh isolated HKD cross-rate observations
        if: inputs.build_hkex == true
        run: node scripts/refresh_usd_rates.cjs --hkd
      - name: Capture dated FMP source evidence without changing valuations
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          CAPTURE_LEASE_SOURCES_ONLY: ${{ inputs.lease_sources_only }}
          CAPTURE_SHARES_ONLY: ${{ inputs.shares_only }}
          CAPTURE_MARKET: ${{ inputs.build_hkex && 'HKEX' || 'US' }}
          CAPTURE_SYMBOLS: ${{ !inputs.build_hkex && inputs.symbols || '' }}
        run: python -u scripts/capture_valuation_sources.py
      - name: Build real HKD inputs without publishing
        if: inputs.build_hkex == true
        env:
          MOAT_EVIDENCE_OUTPUT: valuation-audit-output/hkex-moat-inputs.json
        run: node scripts/build_hkex.cjs valuation-audit-output hkex-data-output
      - name: Refresh cited moat scores and bilingual comments
        if: inputs.build_hkex == true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: python -u scripts/refresh_hkex_moat.py valuation-audit-output/hkex-moat-inputs.json hkex-data-output/cache/hkex_moat.json ${{ inputs.force_moat && '--force' || '' }}
      - name: Build final dated HKEX review artifact
        if: inputs.build_hkex == true
        run: node scripts/build_hkex.cjs valuation-audit-output hkex-data-output hkex-data-output/cache/hkex_moat.json
      - name: Preserve unpublished real HKEX constituent data
        if: always() && inputs.build_hkex == true
        uses: actions/upload-artifact@v4
        with:
          name: hkex-pilot-data
          path: hkex-data-output/
          retention-days: 7
      - name: Preserve source evidence and explicit API limitations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: valuation-fmp-sources
          path: valuation-audit-output/
          retention-days: 7
  translate-news:
    if: inputs.translate_news == true && inputs.expand_all_hk != true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install google-genai
      - name: Translate and save exact-title matches, without articles or deployment
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          GOOGLE_CLOUD_LOCATION: global
        run: python -u scripts/translate_news.py
      - name: Preserve translations and actual token usage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: news-title-translations
          path: |
            cache/news_translations.json
            news-translation-usage.json
          retention-days: 7
  hk-expansion-plan:
    if: inputs.expand_all_hk == true
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - id: plan
        run: echo "matrix=$(node scripts/build_hkex_expansion.cjs matrix)" >> "$GITHUB_OUTPUT"
  hk-expansion-batch:
    needs: hk-expansion-plan
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.hk-expansion-plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install requests google-genai
      - uses: actions/download-artifact@v4
        if: inputs.resume_run_id != ''
        continue-on-error: true
        with:
          name: hkex-expanded-${{ matrix.batch }}
          path: hkex-data-output
          run-id: ${{ inputs.resume_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Refresh dated historical HKD FX observations in the isolated runner
        run: node scripts/refresh_usd_rates.cjs --hkd --all-hkd-currencies
      - name: Capture public evidence for twenty additional companies
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          CAPTURE_MARKET: HKEX
          CAPTURE_ALL_HK: 'true'
          CAPTURE_RESUME: 'true'
          CAPTURE_REQUEST_DELAY: '1'
          CAPTURE_SYMBOLS: ${{ matrix.symbols }}
          CAPTURE_OUTPUT: hkex-data-output/sources
        run: |
          mkdir -p hkex-data-output/sources
          python -u scripts/capture_valuation_sources.py
      - name: Prepare financials, ratios and Piotroski scores without touching reviewed data
        env:
          SYMBOLS: ${{ matrix.symbols }}
        run: |
          node scripts/build_hkex_expansion.cjs build hkex-data-output/sources hkex-data-output "$SYMBOLS" hkex-data-output/moat-reports.json
          cp hkex-data-output/cache/financials/* cache/financials/
      - name: Capture native models and company-page data
        continue-on-error: true
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          CAPTURE_MARKET_FILE: hkex-data-output/market.json
          CAPTURE_PARALLELISM: '1'
          FMP_REQUEST_DELAY: '1'
        run: |
          SYMBOLS=$(node -e "console.log(Object.keys(require('./hkex-data-output/market.json')).join(','))")
          if [ -n "$SYMBOLS" ]; then node scripts/capture_company_data.cjs "$SYMBOLS" hkex-data-output/fmp_model_data.js; fi
      - name: Research each company's actual business with attributable sources
        continue-on-error: true
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          GOOGLE_CLOUD_LOCATION: global
        run: python -u scripts/research_hkex_moat.py hkex-data-output/moat-inputs.json hkex-data-output/researched-inputs.json hkex-data-output/business-research.json
      - name: Assess ten moat dimensions and bilingual comments
        continue-on-error: true
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          GOOGLE_CLOUD_LOCATION: global
        run: python -u scripts/refresh_hkex_moat.py hkex-data-output/researched-inputs.json hkex-data-output/moat-reports.json --retry-incomplete
      - name: Package real coverage and explicit per-company limitations
        if: always()
        env:
          SYMBOLS: ${{ matrix.symbols }}
        run: |
          node scripts/build_hkex_expansion.cjs build hkex-data-output/sources hkex-data-output "$SYMBOLS" hkex-data-output/moat-reports.json
          node scripts/build_hkex_expansion.cjs package hkex-data-output
          mkdir -p hkex-data-output/cache/fx
          cp cache/fx/hkd_rates.json hkex-data-output/cache/fx/hkd_rates.json
      - name: Preserve evidence and unpublished company snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hkex-expanded-${{ matrix.batch }}
          path: hkex-data-output/
          retention-days: 14
