name: HK moat assessments - artifacts only

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --quiet google-genai
      - name: Select the AIA preflight
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          rows = json.loads(Path("valuation-audit-input/hk-moat-evidence.json").read_text())
          Path("moat-preflight-input.json").write_text(json.dumps([r for r in rows if r["ticker"] == "1299.HK"]))
          PY
      - name: Generate the first cited assessment using existing Vertex credentials
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -u scripts/refresh_hkex_moat.py moat-preflight-input.json moat-preflight-results.json --force
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hk-moat-preflight
          path: moat-preflight-results.json
          if-no-files-found: warn
          retention-days: 7

  assess:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [0]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --quiet google-genai
      - name: Select a disjoint saved-evidence batch
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          rows = json.loads(Path("valuation-audit-input/hk-moat-evidence.json").read_text())
          rows = [r for r in rows if r["ticker"] != "1299.HK"]
          rows = [r for i, r in enumerate(rows) if i % 5 == int(os.environ["SHARD"])]
          Path("moat-batch-input.json").write_text(json.dumps(rows))
          print(f"Assessing {len(rows)} companies from saved evidence; no financial-data refresh.")
          PY
      - name: Generate cited bilingual comments and scores
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -u scripts/refresh_hkex_moat.py moat-batch-input.json moat-batch-results.json --force
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hk-moat-batch-${{ matrix.shard }}
          path: moat-batch-results.json
          if-no-files-found: warn
          retention-days: 7
