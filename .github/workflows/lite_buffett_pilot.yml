name: Lite Buffett-v3 moat pilot (5 HK + 5 US)

# Human-only. Agent tokens cannot workflow_dispatch (403).
# Pilot only — uploads artifacts; does not commit production US/HK caches.
# Partial success: job stays green when all US pass and HK failures ≤1 (overall_pass
# in JSON may still be false).
#
# Ticker inputs (important):
# - Empty string or whitespace-only = SKIP that market. Defaults are intentionally
#   empty so clearing the box does NOT resurrect AAPL/MSFT/... or the five HK names
#   (GitHub Actions otherwise reinjects a non-empty default when the field is cleared).
# - Type DEFAULT_HK or DEFAULT_US (exact sentinel) to expand the suggested five-name
#   pilot sets, or paste an explicit comma-separated list.
# - 0941-only re-run: confirm=PILOT; hk_tickers=0941.HK; us_tickers left empty;
#   tooling_ref = this PR branch or main after merge.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type PILOT to run (blocks accidental clicks)'
        required: true
        type: string
      tooling_ref:
        description: 'Git ref with Lite Buffett-v3 code (branch or SHA). Empty = this workflow revision on main after merge.'
        required: false
        type: string
        default: 'main'
      hk_tickers:
        description: 'HK CSV, or DEFAULT_HK for 0700.HK,0005.HK,0388.HK,0941.HK,1299.HK. Empty/whitespace = skip HK (does not fall back to the five). Re-run miss: 0941.HK'
        required: false
        type: string
        default: ''
      us_tickers:
        description: 'US CSV, or DEFAULT_US for AAPL,MSFT,JPM,AMZN,BRK.B. Empty/whitespace = skip US (HK-only; does not fall back to the five).'
        required: false
        type: string
        default: ''
      allow_hk_failures:
        description: 'Exit 0 when all US pass and HK failures ≤ this (default 1). overall_pass JSON still requires all pass.'
        required: false
        type: string
        default: '1'

permissions:
  contents: read
  actions: read

concurrency:
  group: lite-buffett-pilot
  cancel-in-progress: false

jobs:
  pilot:
    if: inputs.confirm == 'PILOT'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout main datasets
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Overlay pilot tooling
        run: |
          REF='${{ inputs.tooling_ref }}'
          git fetch origin "$REF"
          git checkout "origin/$REF" -- \
            scripts/buffett_moat_v3.py \
            scripts/refresh_hkex_moat.py \
            scripts/run_lite_buffett_pilot.py \
            scripts/build_hkex.cjs \
            build_full_market.py \
            tests/test_hkex_moat.py \
            tests/test_us_moat_budget.py \
            tests/test_buffett_moat_v3.py \
            tests/test_lite_buffett_pilot.py \
            .github/workflows/lite_buffett_pilot.yml
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: pip install requests google-genai pydantic
      - name: Resolve ticker lists (empty = skip; DEFAULT_* = pilot set)
        id: resolve
        env:
          RAW_HK: ${{ inputs.hk_tickers }}
          RAW_US: ${{ inputs.us_tickers }}
        run: |
          python3 <<'PY' >> "$GITHUB_OUTPUT"
          import os
          import sys
          from pathlib import Path
          sys.path.insert(0, str(Path.cwd()))
          from scripts.run_lite_buffett_pilot import (
              DEFAULT_HK,
              DEFAULT_US,
              SENTINEL_DEFAULT_HK,
              SENTINEL_DEFAULT_US,
              parse_ticker_list,
          )
          hk = parse_ticker_list(os.environ.get("RAW_HK"), sentinel=SENTINEL_DEFAULT_HK, default_list=DEFAULT_HK)
          us = parse_ticker_list(os.environ.get("RAW_US"), sentinel=SENTINEL_DEFAULT_US, default_list=DEFAULT_US)
          print(f"hk={','.join(hk)}")
          print(f"us={','.join(us)}")
          print(f"has_hk={'true' if hk else 'false'}")
          print(f"has_us={'true' if us else 'false'}")
          if not hk and not us:
              raise SystemExit(
                  "Both hk_tickers and us_tickers are empty after resolve. "
                  "Pass DEFAULT_HK / DEFAULT_US or a CSV list; leave a box empty only to skip that market."
              )
          print(f"Resolved pilot tickers: HK={hk or ['(skip)']} US={us or ['(skip)']}", file=sys.stderr)
          PY
      - name: Capture HK pilot tickers only
        if: steps.resolve.outputs.has_hk == 'true'
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          CAPTURE_MARKET: HKEX
          CAPTURE_OUTPUT: hkex-source-output
          CAPTURE_SYMBOLS: ${{ steps.resolve.outputs.hk }}
        run: python -u scripts/capture_valuation_sources.py
      - name: Build HK moat evidence for pilot tickers only
        if: steps.resolve.outputs.has_hk == 'true'
        env:
          HKEX_BUILD_TICKERS: ${{ steps.resolve.outputs.hk }}
          MOAT_EVIDENCE_OUTPUT: cache/lite_buffett_pilot/moat-inputs.json
        run: |
          mkdir -p cache/lite_buffett_pilot
          node scripts/build_hkex.cjs hkex-source-output hkex-data-output
          test -f cache/lite_buffett_pilot/moat-inputs.json
      - name: Run Lite Buffett-v3 pilot (HK + US)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          MOAT_MODEL: gemini-2.5-flash-lite
          US_MOAT_MODEL: gemini-2.5-flash-lite
          FORCE_MOAT_CONFIRM: YES
          MAX_US_MOAT_GEMINI: 'unlimited'
        run: |
          mkdir -p cache/lite_buffett_pilot
          python -u scripts/run_lite_buffett_pilot.py \
            --hk "${{ steps.resolve.outputs.hk }}" \
            --us "${{ steps.resolve.outputs.us }}" \
            --hk-inputs cache/lite_buffett_pilot/moat-inputs.json \
            --out-dir cache/lite_buffett_pilot \
            --allow-hk-failures "${{ inputs.allow_hk_failures }}" \
            --force
      - name: Upload pilot artifacts (no production commit)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lite-buffett-pilot
          path: cache/lite_buffett_pilot/
          retention-days: 14
          if-no-files-found: warn
