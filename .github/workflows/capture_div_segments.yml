name: Capture FMP dividends and revenue segments

on:
  workflow_dispatch:
    inputs:
      tickers:
        description: Comma-separated tickers (empty = curated US dividend/segment set)
        type: string
        default: ''
      branch:
        description: Branch to checkout and push caches onto
        type: string
        default: 'cursor/div-growth-debt-fcf-db61'

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Capture dividends and revenue segments
        id: capture
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          CAPTURE_REQUEST_DELAY: '180'
          # Pass workflow inputs via env — never interpolate into bash with secrets present.
          INPUT_TICKERS: ${{ inputs.tickers }}
        run: |
          set -euo pipefail
          if [ -z "${FMP_API_KEY:-}" ]; then
            echo "FMP_API_KEY secret is missing"
            exit 1
          fi
          TICKERS="${INPUT_TICKERS:-}"
          if [ -z "$TICKERS" ]; then
            TICKERS='AAPL,MSFT,NVDA,MCD,KO,PEP,JNJ,PG,XOM,CVX,IBM,INTC,CSCO,WMT,T,VZ,MRK,ABBV,AVGO,ORCL,AMD,META,GOOGL,AMZN,TSLA,DIS,NKE,BA,CAT,UNH,HD,MA,V,COST,ADBE,CRM,QCOM,TXN,AMGN,PFE,LLY,BRK.B,JPM,BAC,WFC,GS,MS,C,0700.HK,0005.HK,0939.HK,1398.HK,2318.HK,1299.HK,0388.HK,9988.HK'
          fi
          mkdir -p cache/dividends cache/revenue_segments
          # Soft-continue: empty dividend lists (non-payers) and genuine empty segments
          # must not abort the sibling capture. Scripts exit 0 on soft Empty/NormalizedEmpty;
          # exit 1 when any ticker hard-failed — but partial JSON may already be on disk.
          set +e
          node scripts/capture_dividends.cjs "$TICKERS"
          DIV_STATUS=$?
          node scripts/capture_revenue_segments.cjs "$TICKERS"
          SEG_STATUS=$?
          set -e
          echo "capture_exit dividends=${DIV_STATUS} segments=${SEG_STATUS}"
          printf '%s\n' "$DIV_STATUS" > /tmp/capture_div_status
          printf '%s\n' "$SEG_STATUS" > /tmp/capture_seg_status
          # Never fail this step on hard exits — the commit step must still push partial
          # successful caches. Job failure is deferred to "Assess capture outcome".

      - name: Commit caches when changed
        # Always attempt commit after capture (including when some tickers hard-failed).
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cache/dividends cache/revenue_segments
          if git diff --cached --quiet; then
            echo "No cache changes"
            exit 0
          fi
          git commit -m "Cache FMP dividends and revenue segments for preview"
          git push origin HEAD

      - name: Assess capture outcome
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          DIV_STATUS="$(cat /tmp/capture_div_status 2>/dev/null || echo 1)"
          SEG_STATUS="$(cat /tmp/capture_seg_status 2>/dev/null || echo 1)"
          echo "assess dividends=${DIV_STATUS} segments=${SEG_STATUS}"
          # Soft Empty/NormalizedEmpty already exit 0. Fail the job only when BOTH
          # scripts hard-failed (partial caches were still committed above when present).
          if [ "$DIV_STATUS" -ne 0 ] && [ "$SEG_STATUS" -ne 0 ]; then
            echo "Both captures hard-failed (partial caches were committed if any were written)"
            exit 1
          fi
